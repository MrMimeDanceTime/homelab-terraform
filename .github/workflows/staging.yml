name: Staging

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

env:
  TF_VAR_infisical_client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
  TF_VAR_infisical_client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
  AWS_REGION: us-west-2
  TF_STATE_KEY: env:/staging/terraform.tfstate

jobs:
  validate:
    name: Validate
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.6"

      - name: Init
        run: tofu init -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Validate
        run: tofu validate

  plan:
    name: Plan
    runs-on: self-hosted
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.6"

      - name: Init
        run: tofu init -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Validate
        run: tofu validate

      - name: Plan
        run: tofu plan -var-file="terraform.tfvars" -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: tfplan
          retention-days: 7
