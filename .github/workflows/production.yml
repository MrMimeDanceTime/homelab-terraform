name: Production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  TF_VAR_infisical_client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
  TF_VAR_infisical_client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
  AWS_REGION: us-west-2
  TF_STATE_KEY: env:/production/terraform.tfstate

jobs:
  validate-plan:
    name: Validate & Plan
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.6"

      - name: Init
        run: tofu init -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Validate
        run: tofu validate

      - name: Checkov scan
        continue-on-error: true
        run: |
          if ! command -v checkov &> /dev/null; then
            pip3 install checkov
          fi
          checkov -d . --framework terraform

      - name: Plan
        run: tofu plan -var-file="terraform.tfvars" -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-production-pr${{ github.event.pull_request.number }}
          path: tfplan
          retention-days: 7

  apply:
    name: Apply
    runs-on: self-hosted
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.6"

      - name: Init
        run: tofu init -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: Plan
        run: tofu plan -var-file="terraform.tfvars" -out=tfplan

      - name: Apply
        run: tofu apply -auto-approve tfplan
