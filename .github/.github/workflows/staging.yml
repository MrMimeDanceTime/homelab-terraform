name: Staging

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

env:
  TF_VAR_infisical_client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
  TF_VAR_infisical_client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-west-2
  TF_STATE_KEY: env:/staging/terraform.tfstate

jobs:
  validate:
    name: Validate
    runs-on: self-hosted
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.6"

      - name: Init
        working-directory: .
        run: tofu init -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: Format check
        working-directory: .
        run: tofu fmt -check -recursive

      - name: Validate
        working-directory: .
        run: tofu validate

  plan:
    name: Plan
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.6"

      - name: Init
        working-directory: .
        run: tofu init -backend-config="key=${{ env.TF_STATE_KEY }}"

      - name: Format check
        working-directory: .
        run: tofu fmt -check -recursive

      - name: Validate
        working-directory: .
        run: tofu validate

      - name: Plan
        working-directory: .
        run: tofu plan -var-file="terraform.tfvars" -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-staging
          path: MaC/tfplan
          retention-days: 7
