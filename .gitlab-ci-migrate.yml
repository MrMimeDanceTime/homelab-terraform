stages: [migrate]

migrate-state-to-s3:
  stage: migrate
  image: registry.gitlab.com/gitlab-org/opentofu:1.10.6
  variables:
    AWS_ACCESS_KEY_ID: $MIGRATE_AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $MIGRATE_AWS_SECRET_ACCESS_KEY
    AWS_SESSION_TOKEN: $MIGRATE_AWS_SESSION_TOKEN
    AWS_DEFAULT_REGION: us-west-2
  script:
    # Pull encrypted state from GitLab backend
    - |
      curl --silent --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/production" \
        -o encrypted.tfstate

    # Decrypt using existing passphrase
    - |
      openssl enc -d -aes-256-cbc -pbkdf2 \
        -in encrypted.tfstate \
        -out decrypted.tfstate \
        -pass pass:${GITLAB_TOFU_AUTO_ENCRYPTION_PASSPHRASE}

    # Init with S3 backend
    - |
      tofu init \
        -backend-config="bucket=mac-iac-tfstate" \
        -backend-config="dynamodb_table=mac-iac-tfstate-lock" \
        -backend-config="region=us-west-2" \
        -backend-config="key=env:/production/terraform.tfstate" \
        -backend-config="encrypt=true"

    # Push decrypted state to S3
    - tofu state push decrypted.tfstate

    # Verify
    - tofu state list

  # Run only when manually triggered
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
